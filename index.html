<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Lyrics Video Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080812;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 10px;
    background: linear-gradient(90deg,#6200ea,#d500f9);
}

header h1 {
    font-size: 27px;
}

header p {
    margin-top: 8px;
    color: #eee;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #151525;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #292943;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-weight: bold;
}

input, textarea, select {
    width: 100%;
    padding: 13px;
    background: #222238;
    border: 1px solid #41415c;
    color: white;
    border-radius: 9px;
    font-size: 15px;
}

textarea {
    height: 180px;
    resize: vertical;
}

button {
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: .3s;
}

button:hover {
    transform: scale(1.03);
}

.generate {
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(90deg,#8e2de2,#ff0080);
    color: white;
}

.download {
    width: 100%;
    margin-top: 12px;
    background: #00c853;
    color: white;
    display: none;
}

.preview {
    background: black;
    border-radius: 15px;
    overflow: hidden;
    text-align: center;
}

canvas {
    width: 100%;
    display: block;
}

.status {
    color: #00e676;
    text-align: center;
    margin-top: 15px;
    min-height: 22px;
}

.note {
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🎬 AI Lyrics Video Studio</h1>
    <p>Turn Your Lyrics Into Cinematic Videos</p>
</header>

<div class="container">

<div class="card">

    <h2>✨ Create Your Video</h2>

    <label>Song Title</label>
    <input type="text" id="title" placeholder="Enter song name">

    <label>Paste Your Lyrics</label>
    <textarea id="lyrics" placeholder="Paste your lyrics here...

Example:
Teri yaadon mein kho gaya hoon
Raat bhar main soya nahi
Chand bhi mujhse pooch raha hai
Kyun tu itna udaas hai"></textarea>

    <label>Video Style</label>
    <select id="style">
        <option value="auto">🤖 Automatic Theme</option>
        <option value="love">❤️ Romantic</option>
        <option value="sad">💔 Sad Cinematic</option>
        <option value="nature">🌄 Nature</option>
        <option value="dark">🌑 Dark Cinematic</option>
        <option value="dream">✨ Dream World</option>
    </select>

    <label>Background Music (Optional)</label>
    <input type="file" id="music" accept="audio/*">

    <p class="note">Upload your own audio file. Video duration depends on the lyrics and selected timing.</p>

    <label>Duration Per Line</label>
    <select id="duration">
        <option value="2">2 Seconds</option>
        <option value="3" selected>3 Seconds</option>
        <option value="4">4 Seconds</option>
        <option value="5">5 Seconds</option>
    </select>

    <button class="generate" onclick="startVideo()">
        🚀 Generate Cinematic Video
    </button>

</div>

<div class="card">

    <h2>🎥 Video Preview</h2>

    <div class="preview">
        <canvas id="canvas" width="1080" height="1920"></canvas>
    </div>

    <div class="status" id="status">
        Ready to create your video.
    </div>

    <button class="download" id="download">
        ⬇ Download Video
    </button>

</div>

</div>

<footer>
    AI Lyrics Video Studio | Version 1.0
</footer>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let lines = [];
let currentLine = 0;
let startTime = 0;
let duration = 3;
let recording = false;
let recorder;
let chunks = [];
let particles = [];
let currentTheme = "dream";
let audioElement = null;
let animationFrame;

const themes = {
    love: ["#ff416c","#ff4b2b","#833ab4"],
    sad: ["#141e30","#243b55","#000428"],
    nature: ["#134e5e","#71b280","#203a43"],
    dark: ["#000000","#232526","#414345"],
    dream: ["#654ea3","#eaafc8","#243b55"]
};

function randomColor() {
    return ["#ffffff","#ffdd57","#ff80ab","#80d8ff","#e1bee7"][
        Math.floor(Math.random()*5)
    ];
}

function detectTheme(line) {

    const text = line.toLowerCase();

    if (/love|pyar|ishq|dil|mohabbat|jaan|teri|sanam|prem/.test(text))
        return "love";

    if (/sad|udaas|rona|aansu|tanha|dard|yaad|broken|akela/.test(text))
        return "sad";

    if (/moon|chand|raat|sky|aasman|nature|phool|baarish|sun/.test(text))
        return "nature";

    if (/dark|andhera|shadow|fear|night|khauf/.test(text))
        return "dark";

    return ["love","sad","nature","dark","dream"][
        Math.floor(Math.random()*5)
    ];
}

function createParticles() {

    particles = [];

    for(let i=0;i<75;i++) {
        particles.push({
            x: Math.random()*1080,
            y: Math.random()*1920,
            size: Math.random()*5+2,
            speed: Math.random()*2+0.5,
            alpha: Math.random()
        });
    }
}

function drawBackground(time) {

    const colors = themes[currentTheme] || themes.dream;

    const gradient = ctx.createLinearGradient(
        0,0,
        1080,1920
    );

    gradient.addColorStop(0,colors[0]);
    gradient.addColorStop(0.5,colors[1]);
    gradient.addColorStop(1,colors[2]);

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,1080,1920);

    // Animated light circles

    for(let i=0;i<5;i++) {

        let x = 540 + Math.sin(time/1500+i*2)*350;
        let y = 960 + Math.cos(time/1700+i)*600;

        let glow = ctx.createRadialGradient(x,y,10,x,y,350);

        glow.addColorStop(0,"rgba(255,255,255,0.13)");
        glow.addColorStop(1,"rgba(255,255,255,0)");

        ctx.fillStyle = glow;
        ctx.fillRect(x-350,y-350,700,700);
    }

    // Floating particles

    particles.forEach(p => {

        p.y -= p.speed;

        if(p.y < 0) p.y = 1920;

        ctx.globalAlpha = p.alpha;

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();

    });

    ctx.globalAlpha = 1;
}

function drawText(line,time) {

    const elapsed = time - startTime;

    let progress = Math.min(elapsed/800,1);

    ctx.save();

    ctx.translate(540,960);

    const scale = 0.7 + progress*0.3;

    ctx.scale(scale,scale);

    ctx.globalAlpha = progress;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let words = line.split(" ");
    let rows = [];
    let row = "";

    ctx.font = "bold 75px Arial";

    words.forEach(word => {

        let test = row ? row+" "+word : word;

        if(ctx.measureText(test).width > 850) {
            rows.push(row);
            row = word;
        } else {
            row = test;
        }

    });

    if(row) rows.push(row);

    let lineHeight = 105;
    let startY = -(rows.length-1)*lineHeight/2;

    rows.forEach((text,index) => {

        ctx.shadowColor = randomColor();
        ctx.shadowBlur = 35;

        ctx.fillStyle = "#ffffff";

        ctx.fillText(
            text,
            0,
            startY+index*lineHeight
        );

    });

    ctx.restore();

}

function render() {

    if(!recording) return;

    let now = performance.now();

    let elapsed = now - startTime;

    let index = Math.floor(elapsed/(duration*1000));

    if(index >= lines.length) {
        stopRecording();
        return;
    }

    if(index !== currentLine) {

        currentLine = index;

        currentTheme =
            document.getElementById("style").value === "auto"
            ? detectTheme(lines[index])
            : document.getElementById("style").value;

        createParticles();
    }

    drawBackground(now);

    // Song title

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "bold 42px Arial";

    ctx.fillText(
        document.getElementById("title").value || "MY SONG",
        540,180
    );

    // Lyrics

    drawText(lines[currentLine],now);

    // Footer

    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "30px Arial";
    ctx.fillText("♪ LYRICS VIDEO ♪",540,1740);

    animationFrame = requestAnimationFrame(render);
}

async function startVideo() {

    const lyrics = document.getElementById("lyrics").value.trim();

    if(!lyrics) {
        alert("Please paste your lyrics first!");
        return;
    }

    if(recording) return;

    lines = lyrics.split(/\n/).map(x=>x.trim()).filter(Boolean);

    if(lines.length === 0) return;

    duration = Number(document.getElementById("duration").value);

    currentLine = 0;

    currentTheme =
        document.getElementById("style").value === "auto"
        ? detectTheme(lines[0])
        : document.getElementById("style").value;

    createParticles();

    const stream = canvas.captureStream(30);

    const musicFile = document.getElementById("music").files[0];

    if(musicFile) {

        try {

            if(audioElement) {
                audioElement.pause();
                audioElement = null;
            }

            audioElement = new Audio();

            audioElement.src = URL.createObjectURL(musicFile);
            audioElement.loop = false;

            audioElement.muted = false;

            const audioStream =
                audioElement.captureStream();

            const audioTracks = audioStream.getAudioTracks();

            audioTracks.forEach(track => stream.addTrack(track));

            await audioElement.play();

        } catch(error) {

            console.log("Audio capture unavailable:",error);

        }
    }

    let mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";

    chunks = [];

    try {

        recorder = new MediaRecorder(stream,{
            mimeType:mime
        });

    } catch(error) {

        alert("Video recording is not supported in this browser.");
        return;

    }

    recorder.ondataavailable = e => {
        if(e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = () => {

        const blob = new Blob(chunks,{type:"video/webm"});

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "My-Lyrics-Video.webm";

        document.getElementById("download").onclick = () => {
            a.click();
        };

        document.getElementById("download").style.display = "block";

        document.getElementById("status").innerText =
            "✅ Video generated successfully!";

        if(audioElement) audioElement.pause();

        stream.getTracks().forEach(t=>t.stop());

    };

    recording = true;

    document.getElementById("download").style.display = "none";

    document.getElementById("status").innerText =
        "🎬 Creating your cinematic video...";

    startTime = performance.now();

    recorder.start();

    render();

}

function stopRecording() {

    recording = false;

    cancelAnimationFrame(animationFrame);

    if(recorder && recorder.state === "recording") {
        recorder.stop();
    }

}

drawBackground(0);

</script>

</body>
                                           </html>
